[package]
name = "bc_ocr"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native PP-OCRv6 text detection + recognition core for BookCoverMatcher"

[lib]
name = "bc_ocr"
# `cdylib` is what Android loads (libbc_ocr.so); `rlib` keeps `cargo test` working on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ONNX Runtime bindings, pinned to the API level of the runtime the app already ships
# (com.microsoft.onnxruntime:onnxruntime-android:1.20.0) and built with `load-dynamic`:
# the crate links no ONNX Runtime of its own and resolves `libonnxruntime.so` from the
# process at run time, so two runtimes can never coexist.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-20", "load-dynamic", "std"] }

[dev-dependencies]
# Only the integration test decodes a real JPEG (the app decodes with BitmapFactory, so the crate
# itself needs no codec). Dev-dependencies never reach the Android build.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
