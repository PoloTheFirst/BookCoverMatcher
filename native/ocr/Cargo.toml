[package]
name = "bc_ocr"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native PP-OCRv6 text detection + recognition core for BookCoverMatcher"

[lib]
name = "bc_ocr"
# `cdylib` is what Android loads (libbc_ocr.so); `rlib` keeps `cargo test` working on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Empty on purpose: everything in this crate is platform-independent image/geometry/decoding
# logic. The ONNX Runtime session layer (ort `api-20` + `load-dynamic`) is the next step and is
# specified in `native/ocr/README.md` and the agent report; it is not added until the session and
# recogniser code exists, so the crate always builds.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
