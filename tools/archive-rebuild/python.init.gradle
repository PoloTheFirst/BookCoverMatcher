gradle.beforeProject { project ->
    project.pluginManager.withPlugin("com.chaquo.python") {
        def constraints = new File(project.rootDir, ".archive-rebuild/constraints.txt")
        project.extensions.getByName("chaquopy").defaultConfig.pip.options("--constraint", constraints.absolutePath)
    }
}
